<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Volvemos en un momento · Holandés Nawar</title>
<!--
  Página que ve el alumno si la escuela está reiniciándose (un despliegue, un
  reinicio del contenedor). nginx la sirve él mismo, así que aparece aunque la
  aplicación esté caída. Se recarga sola cada 8 segundos: en cuanto la escuela
  vuelve, el alumno entra sin tocar nada.
  Sin recursos externos a propósito: si el servidor no responde, tampoco
  respondería a una hoja de estilos o a un logo alojado aquí.
-->
<meta http-equiv="refresh" content="8" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background-color: #1D0084;
    background-image:
      radial-gradient(circle, rgba(255,255,255,0.06) 1px, transparent 1px),
      radial-gradient(circle 700px at 100% 0%, rgba(11,109,240,0.40) 0%, transparent 65%),
      radial-gradient(circle 600px at 0% 100%, rgba(11,109,240,0.18) 0%, transparent 65%);
    background-size: 28px 28px, auto, auto;
    background-repeat: repeat, no-repeat, no-repeat;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #fff;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: #fff;
    border-radius: 16px;
    padding: 32px 28px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    color: #1D0084;
  }
  .dot {
    width: 44px; height: 44px;
    margin: 0 auto 18px;
    border-radius: 999px;
    background: #F0F5FF;
    display: flex; align-items: center; justify-content: center;
  }
  .spin {
    width: 18px; height: 18px;
    border: 2.5px solid #DDE6F5;
    border-top-color: #025dc7;
    border-radius: 999px;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 19px; line-height: 1.3; margin: 0 0 8px; font-weight: 700; }
  p { font-size: 14px; line-height: 1.6; color: #5A6480; margin: 0; }
  a { color: #025dc7; font-weight: 600; text-decoration: none; }
  .foot { margin-top: 22px; font-size: 12px; color: #8A96AB; }
</style>
</head>
<body>
  <div class="card">
    <div class="dot"><div class="spin"></div></div>
    <h1>Volvemos en un momento</h1>
    <p>
      La escuela se está actualizando. Esta página se abre sola en cuanto
      termine — no hace falta que hagas nada.
    </p>
    <p class="foot">
      Si tarda más de unos minutos, escríbenos a
      <a href="mailto:info@holandesnawar.com">info@holandesnawar.com</a>
    </p>
  </div>
</body>
</html>
