server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    client_max_body_size 6G;

    # Increase header buffer size
    large_client_header_buffers 4 32k;

    # Increase the maximum allowed size of the client request body
    client_body_buffer_size 32k;

    # Increase the maximum allowed size of the client request header fields
    client_header_buffer_size 32k;

    # ─── Security headers (applied to every response) ──────────────────────────
    # Railway terminates TLS upstream, so HSTS is safe to set unconditionally.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Block MIME sniffing — browsers won't try to "guess" a different content type.
    add_header X-Content-Type-Options "nosniff" always;
    # Don't leak the full URL when the visitor clicks an external link.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Deny sensors we don't use (mitigates 3rd-party scripts grabbing them).
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    # X-Frame-Options NOT set here on purpose — /embed/* needs ALLOWALL and
    # Next.js sets it per-route via next.config.js. Setting it here would
    # duplicate the header and browsers apply the strictest, breaking embeds.

    # ─── Página de "volvemos en un momento" ───────────────────────────────────
    # Si la aplicación está reiniciándose (un despliegue, un crash), nginx sigue
    # en pie y sirve ESTA página en vez del 502 blanco de nginx. Se recarga sola,
    # así que el alumno vuelve a entrar en cuanto la escuela responde.
    error_page 502 503 504 /__offline.html;
    location = /__offline.html {
        root /usr/share/nginx/html;
        internal;
        add_header Cache-Control "no-store" always;
    }

    # Sonda de vida de nginx: responde aunque la aplicación esté caída, así el
    # despliegue distingue "el contenedor no arranca" de "la app está reiniciando".
    location = /__nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Collab server (WebSocket)
    location /collab {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # NextJS Revalidation
    location /api/revalidate {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next Auth
    location /api/auth {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Si la API está reiniciándose, quien llama espera JSON, no la página de
    # "volvemos en un momento". Devolvemos un 503 con cuerpo JSON para que el
    # front lo trate como un fallo normal de red y reintente.
    location @api_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"detail":"La escuela se está reiniciando. Inténtalo de nuevo en unos segundos."}';
    }

    # Python Backend API
    location /api/v1 {
        error_page 502 503 504 = @api_unavailable;
        proxy_pass http://localhost:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Backend Static Content
    location /content {
        proxy_pass http://localhost:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI Docs (only available in development mode)
    location /api/v1/docs {
        proxy_pass http://localhost:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI ReDoc (only available in development mode)
    location /api/v1/redoc {
        proxy_pass http://localhost:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend 
    location / {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}