name: DB Backup → Cloudflare R2

# Off-site backup of the academy Postgres into Cloudflare R2.
# Hobby plan on Railway has no native snapshots, so this is what keeps
# the data safe if Railway goes down or the account is locked.
#
# Schedule: every day at 04:00 UTC (06:00 Madrid in winter / 05:00 in summer).
# Daily, not weekly: with a cohort inside, a week of lost work is a week of
# lessons, notes and messages that nobody can get back. A dump of this database
# is a handful of MB, so the cost of doing it every night is noise.
# Also runnable on demand from the Actions tab → "Run workflow".

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Install pg_dump (matching Railway's Postgres major)
        run: |
          set -euo pipefail
          # Railway runs Postgres 18, and pg_dump refuses to dump a newer server
          # than itself. Ubuntu 24.04 only ships pg 16 in default repos, so we
          # add the PGDG repository to get postgresql-client-18.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl ca-certificates lsb-release gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          # The runner already has postgresql-client (v16) preinstalled, and
          # postgresql-common's /usr/bin/pg_dump wrapper picks v16 over v18.
          # Sidestep the wrapper by calling the v18 binary directly.
          PG_DUMP_18=/usr/lib/postgresql/18/bin/pg_dump
          test -x "$PG_DUMP_18"
          "$PG_DUMP_18" --version  # must report 18.x
          echo "PG_DUMP=$PG_DUMP_18" >> "$GITHUB_ENV"
          aws --version            # CLI v2 is preinstalled on ubuntu-latest

      - name: Compute timestamp
        id: ts
        # YYYYMMDD-HHMMSS sorts lexicographically === chronologically, so the
        # prune step can pick "newest 12" with a plain sort.
        run: echo "stamp=$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Dump + gzip
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
        run: |
          set -euo pipefail
          out="nawar-${{ steps.ts.outputs.stamp }}.sql.gz"
          # --no-owner / --no-acl: restore works against any user/role, not
          #   only the one that produced the dump.
          # gzip -9: maximum compression — backups are read once a quarter at most.
          "$PG_DUMP" --no-owner --no-acl "$DATABASE_URL" | gzip -9 > "$out"
          ls -lh "$out"
          # Hard sanity: empty dumps are a silent disaster.
          test -s "$out"

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          out="nawar-${{ steps.ts.outputs.stamp }}.sql.gz"
          aws s3 cp "$out" \
            "s3://${{ secrets.R2_BUCKET }}/$out" \
            --endpoint-url "${{ secrets.R2_ENDPOINT }}" \
            --only-show-errors
          echo "Uploaded $out"

      - name: Prune (keep newest 30)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          # List → keep only the nawar-* dumps → newest first → skip first 30 →
          # delete the rest. 30 copias diarias = un mes de historia, que es lo
          # que hace falta para darse cuenta de un borrado que pasó inadvertido.
          aws s3 ls "s3://${{ secrets.R2_BUCKET }}/" \
            --endpoint-url "${{ secrets.R2_ENDPOINT }}" \
            | awk '{print $4}' \
            | grep '^nawar-.*\.sql\.gz$' \
            | sort -r \
            | tail -n +31 \
            | while read -r f; do
                echo "Pruning old backup: $f"
                aws s3 rm "s3://${{ secrets.R2_BUCKET }}/$f" \
                  --endpoint-url "${{ secrets.R2_ENDPOINT }}" \
                  --only-show-errors
              done
          echo "Done."
