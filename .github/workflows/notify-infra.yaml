name: Notify Infrastructure

# Heredado de LearnHouse. Solo se lanza a mano (Actions → Run workflow):
# avisa al repositorio de infraestructura de LearnHouse (secretos INFRA_REPO_PAT e INFRA_REPO que esta escuela no tiene) y fallaba en cada subida.
# No se borra para poder volver a encenderlo si algún día hace falta.
on:
  workflow_dispatch:

permissions: {}

jobs:
  notify:
    name: Dispatch to Infrastructure Repo
    runs-on: ubuntu-latest
    steps:
      - name: Send repository dispatch
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.INFRA_REPO_PAT }}
          repository: ${{ vars.INFRA_REPO }}
          event-type: source-update
          client-payload: |
            {
              "sha": "${{ github.sha }}",
              "branch": "${{ github.ref_name }}",
              "event": "${{ github.event_name }}",
              "pr_number": "${{ github.event.pull_request.number || '' }}",
              "pr_action": "${{ github.event.action || '' }}",
              "repo": "${{ github.repository }}"
            }
